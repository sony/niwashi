name: goreleaser

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/golangci-lint.yml

  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      -
        name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
      -
        name: Set up Hugo
        env:
          HUGO_VERSION: 0.165.0
        run: |
          cd "${RUNNER_TEMP}"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${tarball}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p hugo
          tar -xzf "${tarball}" -C hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

version: nws.recipe/v1
kind: node
metadata:
  id: integ-test/stage-export
  version: 1.0.0
spec:
  tasks:
    - name: construct
      action:
        exec.local:
          scriptTpl: |
            echo "construct export {{ .Target }}" >> "@MARKER_FILE@"
      stateChanges:
        cert:
          op: set
          path: "store/ca/cert"
          value: "PEM"

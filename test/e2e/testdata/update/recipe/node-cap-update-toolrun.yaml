version: nws.recipe/v1
kind: node
metadata:
  id: integ-test/update-cap-toolrun
  version: 1.0.0
spec:
  tasks:
    - name: construct
      operation: construct
      action:
        exec.local:
          scriptTpl: |
            echo "construct memory={{ .Params.memory }}"
    # tool.run appears only in the update task, so the adapter is referenced
    # only when the capability is updated.
    - name: update
      operation: update
      action:
        tool.run:
          toolRef: integ-test/update-adapter
          command: reconfigure
